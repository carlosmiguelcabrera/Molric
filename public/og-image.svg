<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F5F4F0"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#gradient)"/>
  
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#6C5CE7;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Logo -->
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#0D0D0F" text-anchor="middle">molr<tspan fill="#6C5CE7">i</tspan>c</text>
  
  <!-- Main headline -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0D0D0F" text-anchor="middle">Recuperá las clientas que</text>
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#6C5CE7" text-anchor="middle">dejaste de ver.</text>
  
  <!-- Subtext -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="20" fill="#666666" text-anchor="middle">Agente de WhatsApp para estéticas</text>
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="20" fill="#666666" text-anchor="middle">Responde 24/7 · Reactiva clientas · Vende por vos</text>
  
  <!-- CTA -->
  <rect x="450" y="500" width="300" height="50" rx="8" fill="#6C5CE7"/>
  <text x="600" y="532" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Desde $149/mes</text>
  
  <!-- URL -->
  <text x="600" y="600" font-family="Arial, sans-serif" font-size="14" fill="#999999" text-anchor="middle">molric.com</text>
</svg>